# Render's free tier sleeps the service after ~15 minutes without inbound
# traffic, and a sleeping service means the next visitor waits 30-90 seconds
# staring at nothing while the process boots. For an app whose entire pitch is
# "snap a leaf, get an answer in seconds", a cold start on the first impression
# is the most expensive possible bug.
#
# This workflow pings the health endpoint often enough that the service never
# idles long enough to sleep. The repo is public, so Actions minutes are free.
#
# A timeout is deliberately NOT treated as a failure on the first attempt. When
# GitHub delays a scheduled run past Render's 15-minute idle window, the service
# is asleep and the ping is what wakes it -- a cold boot takes 30-90s. The old
# 45s timeout with no retry turned that expected cold start into a red run, which
# made the badge useless: a healthy service that had idled looked identical to a
# genuinely broken one. Now a run only fails after every attempt times out.
name: Keep alive

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by a few minutes under
    # load; Render idles at 15, so even a delayed ping lands in time.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Room for three attempts at up to 120s each, plus the gaps between them.
    timeout-minutes: 8
    steps:
      - name: Warm the service
        run: |
          url=https://phytodoctor-ai.onrender.com/healthz
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 120 "$url") || code=000
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ] && grep -q '"ready":true' /tmp/health.json; then
              cat /tmp/health.json; echo
              echo "service is warm"
              exit 0
            fi
            # A 200 that is not ready is a real problem, not a cold start:
            # retrying will not fix a service that answered but is unhealthy.
            if [ "$code" = "200" ]; then
              echo "::warning::service answered HTTP 200 but is not ready"
              cat /tmp/health.json; echo
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::warning::health check failed after 3 attempts (last HTTP $code)"
          exit 1
