<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c2b1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="PhytoDoctor AI — photograph a plant, get an evidence-based diagnosis, and track its recovery." />

    <!-- Brand fonts, self-hosted (see src/styles/fonts.css). The two files
         text is most likely to paint with are preloaded so the type never
         reflows under a late font swap — that swap was ~all of the lab
         page's CLS. The italic Cormorant face loads on demand. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Share previews: what the link looks like in chats, stories and bios. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PhytoDoctor AI" />
    <meta property="og:title" content="PhytoDoctor — snap a leaf. Save a life." />
    <meta property="og:description" content="Free AI plant diagnosis in seconds. Streaks, seeds and a collectible card for every plant you save." />
    <meta property="og:image" content="https://phytodoctor-ai.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://phytodoctor-ai.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PhytoDoctor — snap a leaf. Save a life." />
    <meta name="twitter:description" content="Free AI plant diagnosis in seconds. Streaks, seeds and a collectible card for every plant you save." />
    <meta name="twitter:image" content="https://phytodoctor-ai.onrender.com/og-image.png" />

    <title>PhytoDoctor AI | Botanical Diagnosis Lab</title>
    <style>
      /* First paint is the splash ground, not white: SplashGate (the glass
         crest reveal) owns the intro once React mounts, so the HTML ships no
         second splash — only the colour the reveal lands on. */
      html, body { margin: 0; background: #F4F8F0; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0c2b1f;color:#f4eee1;font-family:Georgia,serif;font-size:18px;text-align:center;padding:24px">
        PhytoDoctor needs JavaScript to run the diagnostic lab.<br/>Enable it and reload — your plants are waiting.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
